name: Atualizar estatísticas

on:
  schedule:
    - cron: "17 5 * * *" # todo dia às 02:17 (horário de Brasília)
  workflow_dispatch: # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install fonttools

      - name: Gerar painel de estatísticas
        run: python3 gerador/atualizar_stats.py
        env:
          # usa o token pessoal (PROFILE_TOKEN) se existir; senão o token padrão do Actions
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: vgmandira7

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git diff --staged --quiet || (git commit -m "chore: atualiza estatísticas do perfil" && git push)
